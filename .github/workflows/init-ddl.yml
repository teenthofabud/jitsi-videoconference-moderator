name: Deploy database migrations
description: Deploy Database Migrations to Aiven DB using flyway (Moderator)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy the application to"
        required: true
        type: choice
        options:
          - dev
          - live
        default: dev

jobs:
  deploy-migrations:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Secrets
        id: secrets
        uses: bitwarden/sm-action@v3.0.0
        with:
          cloud_region: ${{ vars.BITWARDEN_CLOUD_REGION }}
          access_token: ${{ secrets.BITWARDEN_MACHINE_ACCOUNT_TOAB_JITSI_INFRASTRUCTURE_ACCESS_TOKEN_GITHUB_ACTIONS }}
          secrets: |
            ${{ vars.BITWARDEN_UUID_AIVEN_DB_HOST }} > AIVEN_DB_HOST        
            ${{ vars.BITWARDEN_UUID_AIVEN_DB_ADMIN_CREDENTIALS }} > AIVEN_DB_ADMIN_CREDENTIALS
            ${{ vars.BITWARDEN_UUID_FLYWAY_MODERATOR_USERNAME }} > FLYWAY_USERNAME
            ${{ vars.BITWARDEN_UUID_FLYWAY_MODERATOR_PASSWORD }} > FLYWAY_PASSWORD
            ${{ vars.BITWARDEN_UUID_DB_MODERATOR_USERNAME }} > MODERATOR_SERVICE_DB_USERNAME
            ${{ vars.BITWARDEN_UUID_DB_MODERATOR_PASSWORD }} > MODERATOR_SERVICE_DB_PASSWORD
          set_env: true

      - name: Setup PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize Database Roles and Schema
        env:
          FLYWAY_USER: ${{ env.FLYWAY_USERNAME }}
          FLYWAY_PASSWORD: ${{ env.FLYWAY_PASSWORD }}
          APP_USER: ${{ env.MODERATOR_SERVICE_DB_USERNAME }}
          APP_PASSWORD: ${{ env.MODERATOR_SERVICE_DB_PASSWORD }}
          SCHEMA_NAME: jitsi_moderator
          MIGRATOR_ROLE_NAME: moderator_schema_migrator_${{ inputs.environment }}
          SERVER_MANAGER_ROLE_NAME: moderator_server_manager_${{ inputs.environment }}
          DB_URL: postgres://${{ env.AIVEN_DB_ADMIN_CREDENTIALS }}@${{ env.AIVEN_DB_HOST }}/toab-jitsi-${{ inputs.environment }}?sslmode=require
        run: |
          # Replace placeholders and create a temporary hydrated SQL file
          envsubst '${FLYWAY_USER} ${SERVER_MANAGER_ROLE_NAME} ${FLYWAY_PASSWORD} ${SCHEMA_NAME} ${MIGRATOR_ROLE_NAME} ${APP_USER} ${APP_PASSWORD}' \
          < ./sql/init-db.sql > ./sql/init-db-hydrated.sql
          
          # Execute the hydrated file
          psql "${DB_URL}" -f ./sql/init-db-hydrated.sql
          
          # Delete the file so plain-text passwords do not linger on the runner
          rm ./sql/init-db-hydrated.sql

      # Run Flyway as the restricted app_flyway user
      - name: Run Flyway Migrate
        env:
          AIVEN_JDBC_URL: jdbc:postgresql://${{ env.AIVEN_DB_HOST }}/toab-jitsi-${{ inputs.environment }}?sslmode=require
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/sql/ddl:/flyway/sql \
            flyway/flyway:13.3-alpine \
            -url="${AIVEN_JDBC_URL}" \
            -user="${{ env.FLYWAY_USERNAME }}" \
            -password="${{ env.FLYWAY_PASSWORD }}" \
            -schemas="jitsi_moderator" \
            -locations="filesystem:/flyway/sql" \
            migrate