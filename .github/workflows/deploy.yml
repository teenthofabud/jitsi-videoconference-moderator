name: Deploy service
description: Deploy Jitsi video conference moderator service to Lambda

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy the application to"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: dev

jobs:
  deploy-jitsi-moderator-service-lambda:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_JITSI_LAMBDA_DEPLOY_ROLE_NAME }}-${{ inputs.environment }}

      - name: Download and setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.0'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: GraalVM setup verification
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version

      - name: Compile the service into native binary
        run: mvn clean native:compile -Pnative -DskipTests

      - name: Update Lambda Function Code
        run: |
          # Dynamically locate the zip file generated by the assembly plugin
          ZIP_FILE=$(find target -maxdepth 1 -name "*-native-zip.zip" | head -n 1)
          
          echo "Found deployment package: $ZIP_FILE"
          
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }}-${{ inputs.environment }} \
            --zip-file "fileb://$ZIP_FILE"

