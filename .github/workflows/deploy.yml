name: Deploy service
description: Deploy Jitsi video conference moderator service to Lambda

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy the application to"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: dev

jobs:
  deploy-jitsi-moderator-service-lambda:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_JITSI_LAMBDA_DEPLOY_ROLE_NAME }}-${{ inputs.environment }}

      - name: Download and setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.0'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: GraalVM setup verification
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version

      # build normal jar for running the tracing agent to generate reachability-metadata
      - name: Build JAR Package
        run: mvn clean package -DskipTests

      # run the jar with the tracing Agent against the local container database
      - name: Run GraalVM Tracing Agent
        env:
          JITSI_DB_URL: jdbc:postgresql://localhost:5432/testdb
          JITSI_DB_USERNAME: testuser
          JITSI_DB_PASSWORD: testpassword
          JITSI_DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
          JITSI_DB_DRIVER_CLASS: org.postgresql.Driver
          AUTH0_API_IDENTIFIER: test
          AUTH0_DOMAIN: test.com
        run: |
          # Start the app with the tracing agent in the background
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          
          JAR_PATH="target/${ARTIFACT_ID}-${VERSION}.jar"
          CONFIG_DIR="src/main/resources/META-INF/native-image/${GROUP_ID}/${ARTIFACT_ID}"
  
          echo "Running agent for: $JAR_PATH"
          echo "Output config dir: $CONFIG_DIR"
  
          # Run the app with the tracing agent in the background
          java -agentlib:native-image-agent=config-output-dir="$CONFIG_DIR" -jar "$JAR_PATH" &
          APP_PID=$!
          # Wait a few seconds for Spring Boot to fully start up
          sleep 20
          # Gracefully stop the application to flush the JSON files out
          kill -SIGTERM $APP_PID
          wait $APP_PID || true

      - name: Verify Tracing Output
        run: find src/main/resources/META-INF/native-image -type f

      - name: Archive GraalVM Tracing JSONs
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-tracing-jsons
          path: |
            src/main/resources/META-INF/native-image/**/*.json

      - name: Compile the service into native binary
        run: mvn native:compile -Pnative -DskipTests

      - name: Update Lambda Function Code via S3
        run: |
          ZIP_FILE=$(find target -maxdepth 1 -name "*-native-zip.zip" | head -n 1)
          echo "Found deployment package: $ZIP_FILE"

          S3_BUCKET="${{ vars.S3_MODERATOR_DEPLOYMENT_BUCKET }}-${{ inputs.environment }}-${{ secrets.AWS_ACCOUNT_ID }}-${{ vars.AWS_REGION }}-an"
          S3_KEY="deployments/${{ vars.LAMBDA_FUNCTION_NAME }}-${{ inputs.environment }}/$(date +%s).zip"
          
          aws s3 cp "$ZIP_FILE" "s3://$S3_BUCKET/$S3_KEY"

          # Update Lambda to pull from that S3 location
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }}-${{ inputs.environment }} \
            --s3-bucket "$S3_BUCKET" \
            --s3-key "$S3_KEY" \
            --query "{Name: FunctionName, Runtime: Runtime, Memory: MemorySize, CodeSize: CodeSize, LastModified: LastModified, RevisionId: RevisionId}"

