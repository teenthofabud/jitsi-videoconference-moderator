server:
 port: 8080
 forward-headers-strategy: framework

auth0:
 domain: teenthofabud-dev.eu.auth0.com
 audience: 6a774dc84e3c1a8a80714728
 dpop-mode: DISABLED

springdoc:
 swagger-ui:
  validator-url: none

spring:
 application:
  name: "@project.build.finalName@"
  version: "@project.version@"
  description: "@project.description@"
 datasource:
  url: jdbc:postgresql://${MODERATOR_DB_HOST}:${MODERATOR_DB_PORT}/toab-jitsi?currentSchema=jitsi_moderator
  username: ${MODERATOR_DB_USERNAME}
  password: ${MODERATOR_DB_PASSWORD}
  driverClassName: ${MODERATOR_DB_DRIVER_CLASS}
  # Concrete rather than ${MODERATOR_HIKARI_*}: @SpringBootTest classes override these via
  # @TestPropertySource anyway, and @DataJpaTest + @ServiceConnection (AbstractPostgresRepositoryTest)
  # never supplies them at all, so an unresolved placeholder fails Hikari's int binding outright.
  hikari:
   maximum-pool-size: 5
   minimum-idle: 1


 sql:
  init:
   mode: never
 jpa:
  database-platform: ${MODERATOR_DB_DIALECT}
  defer-datasource-initialization: true
  hibernate:
   ddl-auto: none
  show-sql: true
  properties:
   hibernate:
    format_sql: true
    bytecode:
     provider: none
#   jakarta:
#    persistence:
#     schema-generation:
#      create-source: metadata
#      scripts:
#       action: drop-and-create
#       drop-target: src/main/resources/sql/dev-drop.sql
#       create-target: src/main/resources/sql/V2__main.sql

logging:
 level:
  org.hibernate.orm.jdbc.bind: trace



