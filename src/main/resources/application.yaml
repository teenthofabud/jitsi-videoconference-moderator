spring:
 application:
  name: jitsi-conference-moderator
  version: 1.0
  description : Jitsi Video Conference Moderator

 h2:
  console:
   enabled: true

 sql:
  init:
   mode: always

 datasource:
  url: jdbc:h2:mem:mydb
  username: sa
  password: password
  driverClassName: org.h2.Driver

 jpa:
  defer-datasource-initialization: true
  database-platform: org.hibernate.dialect.H2Dialect
  hibernate:
   ddl-auto: update
  show-sql: true
  properties:
   hibernate:
    format_sql: true
