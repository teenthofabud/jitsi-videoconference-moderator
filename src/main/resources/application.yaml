server:
 port: 8091

spring:
 application:
  name: "@project.build.finalName@"
  version: "@project.version@"
  description: "@project.description@"
 config:
  import: classpath:additional-config.yaml
 sql:
  init:
   mode: never
 jpa:
  defer-datasource-initialization: true
  hibernate:
   ddl-auto: update
  show-sql: true
  properties:
   hibernate:
    format_sql: true
#   jakarta:
#    persistence:
#     schema-generation:
#      create-source: metadata
#      scripts:
#       action: drop-and-create
#       drop-target: src/main/resources/sql/dev-drop.sql
#       create-target: src/main/resources/sql/dev-ddl.sql

logging:
 level:
  org.hibernate.orm.jdbc.bind: trace
  org.hibernate.type.descriptor.sql.BasicBinder: TRACE

