spring:
 application:
  name: "@project.build.finalName@"
  version: "@project.version@"
  description : "@project.description@"
 sql:
  init:
   mode: always

 datasource:
  url: ${JITSI_DB_URL}
  username: ${JITSI_DB_USERNAME}
  password: ${JITSI_DB_PASSWORD}
  driverClassName: ${JITSI_DB_DRIVER_CLASS}

 jpa:
  defer-datasource-initialization: true
  database-platform: org.hibernate.dialect.H2Dialect
  hibernate:
   ddl-auto: update
  show-sql: true
  properties:
   hibernate:
    format_sql: true
#   jakarta:
#    persistence:
#     schema-generation:
#      create-source: metadata
#      scripts:
#       action: drop-and-create
#       drop-target: src/main/resources/sql/dev-drop.sql
#       create-target: src/main/resources/sql/dev-ddl.sql

logging:
 level:
  org.hibernate.orm.jdbc.bind: trace
  org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
 port: 8091