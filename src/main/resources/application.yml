server:
 port: 8080
 forward-headers-strategy: framework

auth0:
 domain: ${AUTH0_DOMAIN}
 audience: ${AUTH0_API_IDENTIFIER}
 dpop-mode: DISABLED

springdoc:
 swagger-ui:
  validator-url: none

spring:
 application:
  name: "@project.build.finalName@"
  version: "@project.version@"
  description: "@project.description@"
 datasource:
  url: ${JITSI_DB_URL}
  username: ${JITSI_DB_USERNAME}
  password: ${JITSI_DB_PASSWORD}
  driverClassName: ${JITSI_DB_DRIVER_CLASS}
  hikari:
   maximum-pool-size: ${JITSI_HIKARI_MAX_POOL_SIZE}
   minimum-idle: ${JITSI_HIKARI_MIN_IDLE_COUNT}


 sql:
  init:
   mode: never
 jpa:
  database-platform: ${JITSI_DB_DIALECT}
  defer-datasource-initialization: true
  hibernate:
   ddl-auto: none
  show-sql: true
  properties:
   hibernate:
    format_sql: true
    bytecode:
     provider: none
   jakarta:
    persistence:
     schema-generation:
      create-source: metadata
      scripts:
       action: drop-and-create
       drop-target: src/main/resources/sql/dev-drop.sql
       create-target: src/main/resources/sql/V2__main.sql

logging:
 level:
  org.hibernate.orm.jdbc.bind: trace



