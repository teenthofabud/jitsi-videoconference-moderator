server:
 port: 8080
 forward-headers-strategy: framework

auth0:
 domain: ${AUTH0_DOMAIN}
 audience: ${AUTH0_API_IDENTIFIER}
 dpop-mode: DISABLED

springdoc:
 swagger-ui:
  validator-url: none

spring:
 application:
  name: "@project.build.finalName@"
  version: "@project.version@"
  description: "@project.description@"
 datasource:
  url: jdbc:postgresql://${MODERATOR_DB_HOST}:${MODERATOR_DB_PORT}/${MODERATOR_DB_NAME}?currentSchema=${MODERATOR_SCHEMA_NAME}&sslmode=require
  username: ${MODERATOR_DB_USERNAME}
  password: ${MODERATOR_DB_PASSWORD}
  driverClassName: org.postgresql.Driver
  hikari:
   maximum-pool-size: ${MODERATOR_HIKARI_MAX_POOL_SIZE}
   minimum-idle: ${MODERATOR_HIKARI_MIN_IDLE_COUNT}
   schema: ${MODERATOR_SCHEMA_NAME}

 sql:
  init:
   mode: never
 jpa:
  database-platform: org.hibernate.dialect.PostgreSQLDialect
  defer-datasource-initialization: true
  hibernate:
   ddl-auto: none
  show-sql: true
  properties:
   hibernate:
    format_sql: true
    default_schema: ${MODERATOR_SCHEMA_NAME}
    bytecode:
     provider: none
#   jakarta:
#    persistence:
#     schema-generation:
#      create-source: metadata
#      scripts:
#       action: drop-and-create
#       drop-target: src/main/resources/sql/dev-drop.sql
#       create-target: src/main/resources/sql/V2__main.sql

logging:
 level:
  org.hibernate.orm.jdbc.bind: trace
  com.teenthofabud: info




