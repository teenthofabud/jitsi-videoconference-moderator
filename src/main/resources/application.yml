server:
 port: 8091

auth0:
 domain: ${AUTH0_DOMAIN}
 audience: ${AUTH0_API_IDENTIFIER}
 dpop-mode: DISABLED

spring:
 application:
  name: "@project.build.finalName@"
  version: "@project.version@"
  description: "@project.description@"
 datasource:
  url: ${JITSI_DB_URL}
  username: ${JITSI_DB_USERNAME}
  password: ${JITSI_DB_PASSWORD}
  driverClassName: ${JITSI_DB_DRIVER_CLASS}

 sql:
  init:
   mode: never
 jpa:
  database-platform: ${JITSI_DB_DIALECT}
  defer-datasource-initialization: true
  hibernate:
   ddl-auto: create
  show-sql: true
  properties:
   hibernate:
    format_sql: true
#   jakarta:
#    persistence:
#     schema-generation:
#      create-source: metadata
#      scripts:
#       action: drop-and-create
#       drop-target: src/main/resources/sql/dev-drop.sql
#       create-target: src/main/resources/sql/dev-ddl.sql

logging:
 level:
  org.hibernate.orm.jdbc.bind: trace
  org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  com.auth0: TRACE
  com.auth0.spring: TRACE
  com.auth0.spring.security: TRACE
  org.springframework.security: TRACE



