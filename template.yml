AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Jitsi Video Conference Moderator

Globals:
  Api:
    # API Gateway regional endpoints
    EndpointConfiguration: REGIONAL

Parameters:
  JitsiDbUrl:
    Type : String
  JitsiDbUsername:
    Type: String
  JitsiDbDriverClass:
    Type: String
  JitsiDbPassword:
    Type: String
  JitsiDbDialect:
    Type: String
  Auth0ApiIdentifier:
    Type: String
  Auth0Domain:
    Type: String
  OutlookGraphClientId:
    Type: String
    Default: ''
  OutlookGraphClientSecret:
    Type: String
    NoEcho: true
    Default: ''
  OutlookGraphTenant:
    Type: String
    Default: common
  OutlookGraphRedirectUri:
    Type: String
    Default: ''
  OutlookGraphPublicBaseUrl:
    Type: String
    Default: ''
  OutlookGraphTokenEncryptionKey:
    Type: String
    NoEcho: true
    Default: ''
  OutlookGraphScopes:
    Type: String
    Default: 'openid profile offline_access User.Read Calendars.Read'
Resources:
  MainFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: bootstrap
      Runtime: provided.al2023
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      FunctionUrlConfig:
        AuthType: NONE
      CodeUri: ./target/jitsi-videoconference-moderator-0.1.0-SNAPSHOT-native-zip.zip
      MemorySize: 1512
      Policies: AWSLambdaBasicExecutionRole
      Timeout: 60
      Events:
        HttpApiEvent:
          Type: HttpApi
          Properties:
            TimeoutInMillis: 20000
            PayloadFormatVersion: '1.0'
      Layers:
        # AWS Lambda Web Adaptor Layer
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:23
      Environment:
        Variables:
          JITSI_DB_URL : !Ref JitsiDbUrl
          JITSI_DB_USERNAME : !Ref JitsiDbUsername
          JITSI_DB_DRIVER_CLASS : !Ref JitsiDbDriverClass
          JITSI_DB_PASSWORD : !Ref JitsiDbPassword
          JITSI_DB_DIALECT: !Ref JitsiDbDialect
          AUTH0_API_IDENTIFIER: !Ref Auth0ApiIdentifier
          AUTH0_DOMAIN: !Ref Auth0Domain
          OUTLOOK_GRAPH_CLIENT_ID: !Ref OutlookGraphClientId
          OUTLOOK_GRAPH_CLIENT_SECRET: !Ref OutlookGraphClientSecret
          OUTLOOK_GRAPH_TENANT: !Ref OutlookGraphTenant
          OUTLOOK_GRAPH_REDIRECT_URI: !Ref OutlookGraphRedirectUri
          OUTLOOK_GRAPH_PUBLIC_BASE_URL: !Ref OutlookGraphPublicBaseUrl
          OUTLOOK_GRAPH_TOKEN_ENCRYPTION_KEY: !Ref OutlookGraphTokenEncryptionKey
          OUTLOOK_GRAPH_SCOPES: !Ref OutlookGraphScopes



Outputs:
  VideoConferenceModeratorApi:
    Description: URL for application
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/'
    Export:
      Name: VideoConferenceModeratorApi